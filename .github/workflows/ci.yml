name: Synthetic validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./core
      - run: python scripts/test_synthetic.py
      - run: npx --yes pnpm@11.19.0 install --frozen-lockfile --ignore-scripts
      - run: node scripts/test_chart.cjs
      - run: node scripts/test_dropdown.cjs
      - run: node scripts/test_dashboard.cjs
      - run: python -m build --no-isolation --outdir dist/core core
      - run: python scripts/release.py
      - run: python scripts/check_wheel.py
